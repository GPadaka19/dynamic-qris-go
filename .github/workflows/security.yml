name: Security

on:
  push:
  pull_request:
  schedule:
    # Mingguan (Senin 01:00 UTC) supaya CVE baru tetap ketahuan walau tidak ada commit.
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Hanya melaporkan CVE yang fungsinya benar-benar terpanggil dari kode.
      - run: govulncheck ./...

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t dynamic-qris:scan .
      # Image Trivy di-pin per digest (bukan trivy-action / tag) untuk menghindari supply-chain attack.
      - name: trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --ignore-unfixed --exit-code 1 dynamic-qris:scan
