<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Konversi QRIS Statis menjadi QRIS Dinamis dengan nominal pembayaran kustom." />
    <title>Dynamic QRIS Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-brand">
          <svg class="header-qris-icon" width="36" height="36" viewBox="0 0 36 36" fill="none">
            <rect x="1" y="1" width="14" height="14" rx="2.5" stroke="#e30019" stroke-width="2"/>
            <rect x="4" y="4" width="8" height="8" rx="1" fill="#e30019"/>
            <rect x="21" y="1" width="14" height="14" rx="2.5" stroke="#e30019" stroke-width="2"/>
            <rect x="24" y="4" width="8" height="8" rx="1" fill="#e30019"/>
            <rect x="1" y="21" width="14" height="14" rx="2.5" stroke="#e30019" stroke-width="2"/>
            <rect x="4" y="24" width="8" height="8" rx="1" fill="#e30019"/>
            <rect x="23" y="23" width="4" height="4" rx="0.8" fill="#e30019"/>
            <rect x="29" y="23" width="4" height="4" rx="0.8" fill="#e30019"/>
            <rect x="23" y="29" width="4" height="4" rx="0.8" fill="#e30019"/>
            <rect x="29" y="29" width="4" height="4" rx="0.8" fill="#e30019"/>
          </svg>
          <div>
            <h1>Dynamic QRIS</h1>
            <p class="header-sub">Konversi QRIS Statis → Dinamis</p>
          </div>
        </div>
      </header>

      <div class="form-card">
        <div class="form-card-label">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Memuat QRIS...</span>
        </div>

        <form id="convertForm">
          <div class="form-group">
            <label for="amountInput">Nominal Pembayaran</label>
            <div class="amount-field">
              <span class="amount-prefix">Rp</span>
              <input
                type="text"
                id="amountInput"
                placeholder="10.000"
                inputmode="numeric"
                autocomplete="off"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="remarksInput">
              Keterangan
              <span class="field-optional">opsional</span>
            </label>
            <input
              type="text"
              id="remarksInput"
              placeholder="mis. kopi, makan siang, tagihan..."
              maxlength="60"
              autocomplete="off"
            />
          </div>

          <button type="submit" id="convertBtn" class="btn-generate">
            <span class="btn-text">Generate QRIS</span>
            <span class="btn-loader" style="display:none">
              <span class="spinner"></span>
              Memproses...
            </span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
      </div>

      <div id="errorMessage" class="error-banner" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- QRIS Payment Card -->
      <div id="resultSection" class="payment-card" style="display:none">
        <div class="payment-card-top">
        </div>

        <div class="payment-card-divider"></div>

        <div class="payment-merchant-info">
          <div class="merchant-name" id="merchantName">GP WebWorks</div>
        </div>

        <div class="payment-qr-area">
          <div class="payment-qr-frame">
            <img id="qrImage" alt="QRIS Code" />
          </div>
        </div>

        <div class="payment-details">
          <div class="payment-amount" id="amountDisplay"></div>
          <div class="payment-remarks" id="remarksDisplay"></div>
          <div class="payment-notice">
            QR hanya berlaku untuk 1 kali transaksi
          </div>
        </div>
      </div>

      <!-- Actions below card -->
      <div id="resultActions" class="result-actions" style="display:none">
        <button id="downloadBtn" class="btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Download
        </button>
        <button id="sendBtn" class="btn-action btn-action-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Kirim
        </button>
      </div>

      <details class="qris-string-detail" id="qrisStringDetail" style="display:none">
        <summary>Lihat QRIS String</summary>
        <code id="qrisOutput"></code>
      </details>

      <footer class="footer">
        <p>QRIS EMVCo Dynamic Converter</p>
      </footer>
    </main>

    <!-- Send Modal -->
    <div id="sendModal" class="modal-overlay" style="display:none" aria-modal="true" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-card">

        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Kirim QRIS</span>
          <button class="modal-close-btn" id="modalCloseBtn" aria-label="Tutup">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="modal-search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            id="contactSearch"
            class="contact-search-input"
            placeholder="Cari nama kontak..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="contact-list-wrap" id="contactListWrap">
          <!-- State: initial prompt -->
          <div id="statePrompt" class="contact-state">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.35">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Ketik nama untuk mencari kontak</span>
          </div>
          <!-- State: loading contacts -->
          <div id="stateLoading" class="contact-state" style="display:none">
            <span class="spinner spinner-muted"></span>
            <span>Memuat kontak...</span>
          </div>
          <!-- State: API error -->
          <div id="stateError" class="contact-state contact-state-error" style="display:none">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="stateErrorMsg">Gagal memuat kontak</span>
          </div>
          <!-- State: no results -->
          <div id="stateNoResults" class="contact-state" style="display:none">
            <span>Tidak ada kontak yang cocok</span>
          </div>
          <!-- Contact list -->
          <div id="contactList" class="contact-list"></div>
        </div>

        <!-- Success overlay (absolute over modal content) -->
        <div id="sendSuccessOverlay" class="modal-success-overlay" style="display:none">
          <div class="modal-success">
            <div class="modal-success-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <p>QRIS berhasil dikirim!</p>
            <span id="successRecipient"></span>
          </div>
        </div>

        <div class="modal-footer">
          <div id="selectedContactInfo" class="selected-contact-info" style="display:none">
            <div class="selected-avatar" id="selectedAvatar"></div>
            <div class="selected-meta">
              <span class="selected-name" id="selectedName"></span>
              <span class="selected-phone" id="selectedPhone"></span>
            </div>
          </div>
          <button id="confirmSendBtn" class="btn-confirm-send" disabled>
            <span id="confirmBtnText">Pilih kontak dahulu</span>
            <span id="confirmBtnLoader" class="btn-loader" style="display:none">
              <span class="spinner"></span>
              Mengirim...
            </span>
          </button>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
