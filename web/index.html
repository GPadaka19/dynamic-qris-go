<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Konversi QRIS Statis menjadi QRIS Dinamis dengan nominal pembayaran yang bisa diatur secara manual."
    />
    <title>Dynamic QRIS Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <main class="container">
      <header class="header">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect
              x="2"
              y="2"
              width="14"
              height="14"
              rx="2"
              stroke="url(#grad)"
              stroke-width="2.5"
            />
            <rect
              x="24"
              y="2"
              width="14"
              height="14"
              rx="2"
              stroke="url(#grad)"
              stroke-width="2.5"
            />
            <rect
              x="2"
              y="24"
              width="14"
              height="14"
              rx="2"
              stroke="url(#grad)"
              stroke-width="2.5"
            />
            <rect x="26" y="26" width="4" height="4" rx="1" fill="url(#grad)" />
            <rect x="34" y="26" width="4" height="4" rx="1" fill="url(#grad)" />
            <rect x="26" y="34" width="4" height="4" rx="1" fill="url(#grad)" />
            <rect x="34" y="34" width="4" height="4" rx="1" fill="url(#grad)" />
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
                <stop stop-color="#6366f1" />
                <stop offset="1" stop-color="#a855f7" />
              </linearGradient>
            </defs>
          </svg>
          <h1>Dynamic QRIS</h1>
        </div>
        <p class="subtitle">
          Konversi QRIS Statis → Dinamis dengan nominal kustom
        </p>
      </header>

      <div class="card">
        <form id="convertForm">
          <div class="form-group">
            <label for="qrisInput">
              <span class="label-icon">📋</span>
              QRIS String
              <span class="qris-source" id="qrisSource">⏳ Memuat...</span>
            </label>
            <textarea
              id="qrisInput"
              placeholder="Memuat QRIS dari server..."
              rows="3"
              readonly
            ></textarea>
          </div>

          <div class="form-group">
            <label for="amountInput">
              <span class="label-icon">💰</span>
              Nominal Pembayaran
            </label>
            <div class="amount-wrapper">
              <span class="currency-prefix">Rp</span>
              <input
                type="text"
                id="amountInput"
                placeholder="50.000"
                inputmode="numeric"
                required
              />
            </div>
          </div>

          <button type="submit" id="convertBtn" class="btn-primary">
            <span class="btn-text">Konversi QRIS</span>
            <span class="btn-loader" style="display: none">
              <span class="spinner"></span>
              Memproses...
            </span>
            <svg
              class="btn-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </form>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="error-card" style="display: none">
        <span class="error-icon">⚠️</span>
        <span id="errorText"></span>
      </div>

      <!-- Result -->
      <div id="resultSection" class="result-card" style="display: none">
        <h2 class="result-title">✅ QRIS Dinamis Berhasil Dibuat</h2>

        <div class="qr-container">
          <div class="qr-frame">
            <img id="qrImage" alt="Dynamic QRIS QR Code" />
          </div>
          <div class="amount-badge" id="amountBadge"></div>
        </div>

        <div class="result-actions">
          <button
            id="downloadBtn"
            class="btn-secondary"
            title="Download QR Code"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"
              />
            </svg>
            Download QR
          </button>
          <button id="copyBtn" class="btn-secondary" title="Copy QRIS String">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
            </svg>
            Copy String
          </button>
        </div>

        <details class="qris-details">
          <summary>Lihat QRIS String</summary>
          <code id="qrisOutput"></code>
        </details>
      </div>

      <footer class="footer">
        <p>Built with Go & ❤️ — QRIS EMVCo Converter</p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
